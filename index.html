<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Visualizations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="hero-glow" class="hero-glow"></div>
  <div id="particle-container" class="particle-container"></div>

  <nav class="site-nav">
    <a class="site-nav__brand" href="./">Math Visualizations</a>
  </nav>

  <section class="home-hero">
    <h1 class="home-hero__title">Math Visualizations</h1>
    <p class="home-hero__subtitle">Explore mathematical concepts through direct interaction. Move beyond abstract notation into a space where logic becomes visible.</p>
    <div class="filament-line"></div>
  </section>

  <section class="bento-wrapper">
    <div id="grid" class="bento-grid"></div>

  </section>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a class="site-footer__github" href="https://github.com/kmhs-ph/math-viz" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </footer>

  <script type="module" src="./main.js"></script>
  <script>
    const glow = document.getElementById('hero-glow')
    window.addEventListener('mousemove', e => {
      glow.style.left = e.clientX + 'px'
      glow.style.top  = e.clientY + 'px'
    })

    const container = document.getElementById('particle-container')
    for (let i = 0; i < 20; i++) {
      const dot = document.createElement('div')
      dot.className = 'particle'
      const size = Math.random() * 3 + 1
      dot.style.width  = size + 'px'
      dot.style.height = size + 'px'
      dot.style.left   = (Math.random() * 100) + '%'
      dot.style.top    = (Math.random() * 100) + '%'
      const dur   = (Math.random() * 10 + 10) * 1000
      const delay = Math.random() * -20 * 1000
      dot.animate([
        { transform: 'translate(0,0)', opacity: 0.1 },
        { transform: `translate(${Math.random()*200-100}px,${Math.random()*200-100}px)`, opacity: 0.3 },
        { transform: 'translate(0,0)', opacity: 0.1 },
      ], { duration: dur, iterations: Infinity, delay, easing: 'ease-in-out' })
      container.appendChild(dot)
    }
  </script>
</body>
</html>
