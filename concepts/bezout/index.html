<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bézout's Theorem — Math Viz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .bezout-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr;
      height: calc(100vh - 48px);
      overflow: hidden;
    }
    .bezout-sidebar {
      background: var(--surface-container);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 12px;
    }
    .bezout-sidebar h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 4px;
    }
    .poly-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .poly-input-group label {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .poly-input-group input[type="text"] {
      background: var(--surface-container-high);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .poly-input-group input[type="text"]:focus {
      border-color: var(--accent);
    }
    .poly-input-group input[type="text"].error {
      border-color: #f28b82;
    }
    .parse-error {
      font-size: 11px;
      color: #f28b82;
      font-family: var(--font-mono);
      min-height: 14px;
    }
    .curve-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .intersection-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .intersection-item {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      padding: 4px 8px;
      background: var(--surface-container-high);
      border-radius: 4px;
      line-height: 1.5;
    }
    .intersection-item.real { color: #a8d8a8; }
    .intersection-item.complex { color: #aac4e8; }
    .intersection-item.infinite { color: #e8d0aa; }
    .epsilon-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .epsilon-row label { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
    .info-text {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .bezout-count {
      font-size: 12px;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    .example-btn {
      font-size: 11px;
      padding: 4px 8px;
      background: var(--surface-container-high);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: border-color 0.15s, color 0.15s;
    }
    .example-btn:hover { border-color: var(--accent); color: var(--text); }
    .examples-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
  </style>
  <script type="module" crossorigin src="/math-viz/assets/bezout-BstVxveb.js"></script>
  <link rel="modulepreload" crossorigin href="/math-viz/assets/style-elFVMjQj.js">
  <link rel="modulepreload" crossorigin href="/math-viz/assets/canvas-utils-CVWB7avU.js">
  <link rel="stylesheet" crossorigin href="/math-viz/assets/style-B71MHOi4.css">
</head>
<body>

  <nav class="site-nav">
    <a class="site-nav__brand" href="../../">Math Visualizations</a>
    <div class="site-nav__concept">
      <span class="site-nav__title">Bézout's Theorem</span>
    </div>
  </nav>

  <div class="concept-page bezout-layout">

    <aside class="bezout-sidebar">
      <h2>Bézout's Theorem</h2>
      <p class="info-text">
        Two curves of degrees <em>d₁</em> and <em>d₂</em> in ℝP² intersect in exactly
        <strong>d₁·d₂</strong> points (counted with multiplicity, over ℂ).
      </p>

      <div class="divider"></div>

      <div class="section-label">Curve f(x,y) = 0</div>
      <div class="poly-input-group">
        <label><span class="curve-swatch" id="swatch-f" style="background:#7eb8f7"></span>f(x, y) =</label>
        <input type="text" id="input-f" value="x^2 + y^2 - 1" autocomplete="off" spellcheck="false" />
        <div class="parse-error" id="err-f"></div>
      </div>

      <div class="section-label">Curve g(x,y) = 0</div>
      <div class="poly-input-group">
        <label><span class="curve-swatch" id="swatch-g" style="background:#f7c07e"></span>g(x, y) =</label>
        <input type="text" id="input-g" value="y - x^2 + 0.5" autocomplete="off" spellcheck="false" />
        <div class="parse-error" id="err-g"></div>
      </div>

      <div class="divider"></div>

      <div class="section-label">Examples</div>
      <div class="examples-grid" id="examples-grid"></div>

      <div class="divider"></div>

      <div class="section-label">Complex threshold ε</div>
      <div class="epsilon-row">
        <label>ε =</label>
        <input type="range" id="epsilon-slider" min="-3" max="0" step="0.05" value="-1.5" style="flex:1" />
        <span id="epsilon-val" style="font-size:12px;font-family:var(--font-mono);color:var(--accent);width:50px;text-align:right">0.032</span>
      </div>

      <div class="divider"></div>

      <div class="section-label">Intersections</div>
      <div class="bezout-count" id="bezout-count"></div>
      <div class="intersection-list" id="intersection-list"></div>
    </aside>

    <div class="concept-canvas-area">
      <canvas id="bezout-canvas"></canvas>
    </div>

  </div>

</body>
</html>
