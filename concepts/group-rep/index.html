<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finite Group Representations — Math Viz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/math-viz/assets/group-rep-rxBzMMFV.js"></script>
  <link rel="modulepreload" crossorigin href="/math-viz/assets/style-BkIbOE3j.js">
  <link rel="modulepreload" crossorigin href="/math-viz/assets/canvas-utils-CVWB7avU.js">
  <link rel="stylesheet" crossorigin href="/math-viz/assets/style-TVrfYs4K.css">
</head>
<body>
  <div class="concept-page">

    <!-- nav + group selector -->
    <nav class="concept-nav">
      <a class="back-link" href="../../">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Home
      </a>
      <span style="color:var(--border)">|</span>
      <h1>Finite Group Representations</h1>

      <div class="gr-top-bar" style="border:none; padding:0; margin-left:auto;">
        <div class="ctrl-group">
          <span class="ctrl-label">Group</span>
          <select id="sel-group"></select>
        </div>
      </div>
    </nav>

    <!-- 3-panel main -->
    <div class="gr-layout">

      <!-- left: irrep list + character table + matrix -->
      <aside class="gr-irrep-panel">
        <div class="gr-panel-section">
          <div class="gr-panel-title">Irreducible Reps</div>
          <div id="irrep-list" class="gr-irrep-list"></div>
        </div>
        <div class="gr-panel-section" style="flex:1">
          <div class="gr-panel-title">Character Table</div>
          <div id="char-table" class="gr-char-table"></div>
        </div>
        <div class="gr-panel-section">
          <div class="gr-panel-title" id="matrix-label">ρ(e)</div>
          <div id="matrix-display"></div>
        </div>
      </aside>

      <!-- center: visualization -->
      <section class="gr-viz">
        <div class="gr-viz-header">
          <span id="viz-irrep-name" class="gr-viz-title">—</span>
          <span id="viz-dim" style="font-size:0.78rem;color:var(--text-muted)"></span>
        </div>
        <div class="gr-canvas-wrap">
          <canvas id="main-canvas"></canvas>
          <div id="edge-palette" class="edge-palette" style="display:none">
            <button class="palette-btn palette-erase active" data-idx="0" title="Erase">✕</button>
            <button class="palette-btn" data-idx="1" style="--pc:#ff6b6b" title="Red"></button>
            <button class="palette-btn" data-idx="2" style="--pc:#ffd93d" title="Yellow"></button>
            <button class="palette-btn" data-idx="3" style="--pc:#6bcb77" title="Green"></button>
            <button class="palette-btn" data-idx="4" style="--pc:#4d96ff" title="Blue"></button>
            <button class="palette-btn" data-idx="5" style="--pc:#c77dff" title="Purple"></button>
          </div>
        </div>
      </section>

      <!-- right: element composer -->
      <aside class="gr-composer">
        <div class="gr-panel-section">
          <div class="gr-panel-title">Generators</div>
          <div id="gen-buttons" class="gr-gen-buttons"></div>
        </div>
        <div class="gr-panel-section" style="flex:1">
          <div class="gr-panel-title">Composition</div>
          <div id="composition-box" class="gr-composition-box">
            <span style="color:var(--text-muted)">e</span>
          </div>
          <div style="margin-top:8px; font-size:0.75rem; color:var(--text-muted)">
            Normal form: <span id="normal-form" class="gr-element-badge">e</span>
          </div>
        </div>
        <div class="gr-panel-section">
          <div class="gr-composer-actions">
            <button class="btn" id="btn-undo">← Undo</button>
            <button class="btn" id="btn-reset">Reset</button>
          </div>
        </div>
      </aside>

    </div>
  </div>

</body>
</html>
